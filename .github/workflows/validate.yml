name: Validate plugin registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node scripts/catalog.mjs generate
      - run: npm test
      - run: node scripts/validate-registry.mjs
        env:
          REGISTRY_BASE_REF: ${{ github.event.before }}
      - run: node scripts/validate-plugins.mjs .
