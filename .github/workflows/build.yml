name: Build MicroCon Helper plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      # Node is only needed for the marketplace release tooling below.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.94.1-${{ matrix.target }} --profile minimal
      - run: rustup default 1.94.1-${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Stage compiled binary into bin/
        shell: bash
        run: |
          if [ -f target/release/oxideterm-microcon-helper.exe ]; then
            cp target/release/oxideterm-microcon-helper.exe bin/
          else
            cp target/release/oxideterm-microcon-helper bin/
          fi
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-plugin.mjs prepare .
      - name: Package Unix plugin
        if: runner.os != 'Windows'
        run: sh scripts/package.sh
      - name: Package Windows plugin
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/package.ps1
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: microcon-helper-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: microcon-helper-*
          path: dist/plugin-release
          merge-multiple: true
      - name: Verify identity and generate the release record
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-plugin.mjs entry . --release-url "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG" --packages-dir dist/plugin-release --output dist/plugin-release/catalog-entry.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const manifest=JSON.parse(fs.readFileSync('plugin.json'));
          assert.equal(process.env.RELEASE_TAG,`v${manifest.version}`);
          const targets=['aarch64-apple-darwin','x86_64-apple-darwin','aarch64-unknown-linux-gnu','x86_64-unknown-linux-gnu','aarch64-pc-windows-msvc','x86_64-pc-windows-msvc'];
          const entry=JSON.parse(fs.readFileSync('dist/plugin-release/catalog-entry.json'));
          const release=entry.releases.find(release=>release.version===manifest.version);
          assert.deepEqual(release.packages.map(pkg=>pkg.target).sort(),targets.sort());
          const packages=new Set(release.packages.map(pkg=>decodeURIComponent(path.basename(new URL(pkg.downloadUrl).pathname))));
          for(const file of fs.readdirSync('dist/plugin-release')) {
            if(file.endsWith('.zip') && !packages.has(file)) fs.unlinkSync(path.join('dist/plugin-release',file));
          }
          NODE
      - name: Publish all validated assets together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/plugin-release/*.zip dist/plugin-release/catalog-entry.json --verify-tag --title "$RELEASE_TAG" --generate-notes --draft --latest=false
          gh release edit "$RELEASE_TAG" --draft=false --latest=false

  catalog:
    needs: release
    uses: ./.github/workflows/catalog.yml
